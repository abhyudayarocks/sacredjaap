<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacred Jaap</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1A1A24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imageedit_2_3478557917.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: radial-gradient(circle at 50% 150%, #1A1A24, #000000); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #main-view, #history-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; transition: transform 0.4s ease; }
        #history-view { transform: translateX(100%); background: #000; padding: 20px; overflow-y: auto; }
        .show-history #main-view { transform: translateX(-100%); }
        .show-history #history-view { transform: translateX(0); }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; }
        .counter-section { text-align: center; background: #1C1C1E; padding: 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
        .count-display { font-size: 70px; font-weight: 900; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .card { background: #1C1C1E; border: 1px solid #FFB75E; border-radius: 12px; padding: 8px; text-align: center; }
        .card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .main-btn { width: 90%; margin: 20px auto; padding: 20px; border-radius: 20px; border: none; background: linear-gradient(90deg, #FFB75E, #ED8F03); font-size: 22px; font-weight: 900; color: white; }
    </style>
</head>
<body>
    <div id="main-view">
        <div class="counter-section">
            <div class="top-bar">
                <button onclick="saveLog()">Save Log</button>
                <button onclick="toggleHistory(true)">History</button>
            </div>
            <div id="countDisplay" class="count-display">0</div>
        </div>
        <div class="grid" id="deityGrid"></div>
        <button class="main-btn" onclick="incrementCount()">TAP TO COUNT</button>
    </div>
    <div id="history-view">
        <button onclick="toggleHistory(false)">Back</button>
        <div id="logsContainer"></div>
    </div>
    <script>
        const deities = [
            { title: "स्वाद कमल", img: "brahma.jpeg" }, { title: "मूल कमल", img: "ganesh.jpeg" },
            { title: "नाभि कमल", img: "vishnu.jpeg" }, { title: "कण्ठ कमल", img: "durga.jpg" },
            { title: "हृदय कमल", img: "shiva.jpeg" }, { title: "सत्य पुरुष", img: "satyam.jpeg" }
        ];
        let count = 0;
        const grid = document.getElementById('deityGrid');
        deities.forEach(d => {
            grid.innerHTML += `<div class="card"><img src="${d.img}"><div>${d.title}</div></div>`;
        });
        function incrementCount() { count++; document.getElementById('countDisplay').innerText = count; if(navigator.vibrate) navigator.vibrate(40); }
        function toggleHistory(show) { document.body.classList.toggle('show-history', show); }
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
