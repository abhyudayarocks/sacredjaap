<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sacred Jaap</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imageedit_2_3478557917.jpg">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 40px 20px 20px; display: flex; justify-content: space-between; align-items: center; }
        .counter-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .count-text { font-size: 80px; font-weight: 700; color: #FFD700; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .card { background: #1c1c1c; border-radius: 20px; padding: 15px; text-align: center; border: 1px solid #333; }
        .card img { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 8px; }
        .main-btn { margin: 20px; padding: 25px; border-radius: 30px; background: #FFD700; color: #000; font-size: 20px; font-weight: bold; border: none; }
        .main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="header"><div>Jaap</div><button onclick="alert('History feature here')">History</button></div>
    <div class="counter-container"><div id="count" class="count-text">0</div></div>
    <div class="grid" id="grid"></div>
    <button class="main-btn" onclick="count++">TAP TO COUNT</button>
    <script>
        let count = 0;
        const deities = ["brahma.jpeg", "ganesh.jpeg", "vishnu.jpeg", "durga.jpg", "shiva.jpeg", "satyam.jpeg"];
        const grid = document.getElementById('grid');
        deities.forEach(src => grid.innerHTML += `<div class="card"><img src="${src}"></div>`);
        setInterval(() => document.getElementById('count').innerText = count, 100);
    </script>
</body>
</html>
