<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sacred Jaap</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imageedit_2_3478557917.jpg">
    <style>
        :root { --gold: #FFD700; --bg: #000000; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; 
               height: 100vh; overflow: hidden; overscroll-behavior: none; user-select: none; }
        
        #app { display: flex; flex-direction: column; height: 100vh; padding-top: env(safe-area-inset-top); }
        
        .counter-box { flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #count { font-size: 120px; font-weight: 800; color: var(--gold); transition: transform 0.1s; }
        
        .tap-btn { margin: 20px 20px 40px; padding: 30px; background: var(--gold); color: black; border-radius: 40px; 
                   font-size: 24px; font-weight: 900; border: none; box-shadow: 0 10px 20px rgba(255,215,0,0.3); }
        .tap-btn:active { transform: scale(0.95); }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 10px; text-align: center; }
        .card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="app">
        <div class="counter-box"><div id="count">0</div></div>
        <div class="grid" id="grid"></div>
        <button class="tap-btn" id="tapBtn">TAP TO COUNT</button>
    </div>

    <script>
        let count = localStorage.getItem('jaapCount') || 0;
        const countDisplay = document.getElementById('count');
        const tapBtn = document.getElementById('tapBtn');
        countDisplay.innerText = count;

        tapBtn.addEventListener('click', () => {
            count++;
            localStorage.setItem('jaapCount', count);
            countDisplay.innerText = count;
            countDisplay.style.transform = 'scale(1.1)';
            setTimeout(() => countDisplay.style.transform = 'scale(1)', 100);
            if(navigator.vibrate) navigator.vibrate(50);
        });

        const deities = ["brahma.jpeg", "ganesh.jpeg", "vishnu.jpeg", "durga.jpg", "shiva.jpeg", "satyam.jpeg"];
        const grid = document.getElementById('grid');
        deities.forEach(src => grid.innerHTML += `<div class="card"><img src="${src}"></div>`);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const worker = reg.installing;
                    worker.onstatechange = () => {
                        if (worker.state === 'installed') window.location.reload();
                    };
                };
            });
        }
    </script>
</body>
</html>
